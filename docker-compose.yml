version: "3.9"

services:
  # ✅ Database
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: alizdb
      MYSQL_USER: aliz
      MYSQL_PASSWORD: aliztest
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ✅ DNS Resolver Service
  dns-resolver-service:
    build:
      context: ./dns-resolver-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  # ✅ Database Service
  db-service:
    build:
      context: ./db-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: aliz
      DB_PASSWORD: aliztest
      DB_NAME: alizdb
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  # ✅ Gateway Service (main API for frontend)
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - dns-resolver-service
      - db-service

  # ✅ Health Service
  health-service:
    build:
      context: ./health-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: aliz
      DB_PASSWORD: aliztest
      DB_NAME: alizdb
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy

  # ✅ Config Service
  config-service:
    build:
      context: ./config-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: aliz
      DB_NAME: alizdb
    ports:
      - "8004:8000"

  # ✅ Frontend
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - gateway-service

volumes:
  mysql_data:
